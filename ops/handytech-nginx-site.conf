server {
    listen 443 ssl;
    server_name handytech-solutions.com www.handytech-solutions.com 74.208.149.78;
    client_max_body_size 250M;

    ssl_certificate /etc/letsencrypt/live/handytech-solutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handytech-solutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This is a Node application. Reject PHP-family probes at the edge so
    # they never consume an application session or reach Express.
    location ~* \.php(?:$|/) {
        return 404;
    }
    location ~* \.(?:phtml|phar)(?:$|/) {
        return 404;
    }

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name handytech-solutions.com www.handytech-solutions.com 74.208.149.78;

    return 301 https://$host$request_uri;
}
